name: Go

on:
  push:
    branches: [ release-2.8 ]
  pull_request:
    branches: [ release-2.8 ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.21

    - name: Verify Go version
      run: |
        go version
        which go
        echo "PATH: $PATH"

    - name: Remove pre-installed Go (if any)
      run: |
        sudo rm -rf /usr/local/go || true
        echo "Removed any pre-installed Go versions."

    - uses: actions/cache@v3
      with:
        # In order:
        # * Module download cache
        # * Build cache (Linux)
        # * Build cache (Mac)
        # * Build cache (Windows)
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
          %LocalAppData%\go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Debug Environment
      run: |
        go env
        ls -R /opt/hostedtoolcache/go || true
